<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — Moon Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg: #070b14;
            --bg-2: #0d1424;
            --text: #e8ecf5;
            --muted: #6b7794;
            --border: #1e2a44;
            --blue: #2f8bff;
            --blue-hover: #1a7aee;
            --error: #ff6b6b;
        }
        
        html, body { height: 100%; }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(47,139,255,0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(47,139,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(47,139,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }
        
        .login-wrap {
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.6s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo {
            text-align: center;
            margin-bottom: 48px;
        }
        
        .logo-mark {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 38px;
            font-weight: 700;
            letter-spacing: -1.5px;
        }
        
        .logo-mark .moon { color: #ffffff; }
        .logo-mark .studio { color: var(--blue); }
        
        .logo-mark svg {
            width: 30px;
            height: 30px;
            margin-right: -2px;
        }
        
        .tagline {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            margin-top: 10px;
            letter-spacing: 0.2px;
        }
        
        .form-group {
            margin-bottom: 18px;
            position: relative;
        }
        
        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 8px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        
        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .input-box svg {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: var(--muted);
            pointer-events: none;
            transition: color 0.2s;
        }
        
        .input-box input {
            width: 100%;
            padding: 14px 14px 14px 44px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        .input-box input::placeholder { color: #3d4a63; }
        
        .input-box input:focus {
            outline: none;
            border-color: var(--blue);
            background: rgba(47,139,255,0.04);
            box-shadow: 0 0 0 3px rgba(47,139,255,0.1);
        }
        
        .input-box input:focus ~ svg { color: var(--blue); }
        
        .toggle-pass {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            color: var(--muted);
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        
        .toggle-pass:hover { color: var(--text); }
        .toggle-pass svg { position: static; width: 18px; height: 18px; }
        
        .input-box input.field-error { border-color: var(--error); }
        .input-box input.field-error:focus {
            border-color: var(--error);
            box-shadow: 0 0 0 3px rgba(255,107,107,0.1);
        }
        .error-text {
            display: none;
            font-size: 12px;
            color: var(--error);
            margin-top: 6px;
        }
        .error-text.show { display: block; }
        
        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 22px 0;
            font-size: 13px;
        }
        
        .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--muted);
            user-select: none;
        }
        
        .checkbox-wrap input { display: none; }
        
        .checkbox-custom {
            width: 16px;
            height: 16px;
            border: 1px solid var(--border);
            border-radius: 4px;
            position: relative;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        
        .checkbox-wrap input:checked + .checkbox-custom {
            background: var(--blue);
            border-color: var(--blue);
        }
        
        .checkbox-wrap input:checked + .checkbox-custom::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 1px;
            width: 4px;
            height: 9px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        
        .forgot {
            color: var(--blue);
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .forgot:hover { opacity: 0.8; }
        
        .btn-login {
            width: 100%;
            padding: 15px;
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-login:hover:not(:disabled) {
            background: var(--blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(47,139,255,0.25);
        }
        .btn-login:active:not(:disabled) { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .btn-login.loading .spinner { display: block; }
        .btn-login.loading .btn-text { opacity: 0.7; }
        
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 28px 0 20px;
            color: var(--muted);
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        
        .socials { display: flex; gap: 10px; }
        
        .social-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .social-btn:hover {
            background: rgba(255,255,255,0.05);
            border-color: #2a3a5c;
        }
        .social-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .social-btn svg { width: 16px; height: 16px; }
        
        .footer {
            text-align: center;
            margin-top: 36px;
            font-size: 12px;
            color: var(--muted);
        }
        .footer a { color: var(--blue); text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #16203a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 100;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            max-width: 90vw;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { border-color: var(--error); }
        .toast.success { border-color: #2ecc71; }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="logo">
            <div class="logo-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="#2f8bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                <span class="moon">Moon</span><span class="studio">Studio</span>
            </div>
            <div class="tagline">Chào mừng trở lại</div>
        </div>
        
        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <div class="input-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <!-- LƯU Ý: Firebase Auth dùng EMAIL → ô này nhập email -->
                    <input type="text" id="username" placeholder="Nhập email" autocomplete="username" required>
                </div>
                <span class="error-text" id="usernameError" aria-live="polite"></span>
            </div>
            
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <div class="input-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
                    <button type="button" class="toggle-pass" id="togglePass" aria-label="Hiện mật khẩu">
                        <svg id="eyeOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg id="eyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
                <span class="error-text" id="passwordError" aria-live="polite"></span>
            </div>
            
            <div class="form-row">
                <label class="checkbox-wrap">
                    <input type="checkbox" id="remember">
                    <span class="checkbox-custom"></span>
                    <span>Ghi nhớ đăng nhập</span>
                </label>
                <a href="#" class="forgot" id="forgotLink">Quên mật khẩu?</a>
            </div>
            
            <button type="submit" class="btn-login" id="btnLogin">
                <span class="spinner"></span>
                <span class="btn-text">Đăng nhập</span>
            </button>
        </form>
        
        <div class="divider">hoặc tiếp tục với</div>
        
        <div class="socials">
            <button type="button" class="social-btn" id="googleBtn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Google
            </button>
            <button type="button" class="social-btn" id="facebookBtn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/>
                </svg>
                Facebook
            </button>
        </div>
        
        <div class="footer">
            <span id="modeText">Chưa có tài khoản? </span><a href="#" id="toggleMode">Đăng ký ngay</a>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <!-- Firebase + logic đăng nhập thật (type="module" để import SDK) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
        import {
            getAuth, setPersistence, browserLocalPersistence, browserSessionPersistence,
            signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail,
            sendEmailVerification, onAuthStateChanged, GoogleAuthProvider, FacebookAuthProvider,
            signInWithPopup
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        // ===== Firebase config (của bạn) =====
        const firebaseConfig = {
            apiKey: "AIzaSyDlTcZfcnoftOYIGEXPcmr_3g9pYcms3V8",
            authDomain: "wifichecker-ccf9b.firebaseapp.com",
            projectId: "wifichecker-ccf9b",
            storageBucket: "wifichecker-ccf9b.firebasestorage.app",
            messagingSenderId: "58738730558",
            appId: "1:58738730558:web:b0c0e18daac85aa3d9136f",
            measurementId: "G-5MLQGREBJE"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();
        const facebookProvider = new FacebookAuthProvider();

        // ===== Các phần tử DOM =====
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('btnLogin');
        const btnText = btn.querySelector('.btn-text');
        const togglePass = document.getElementById('togglePass');
        const passInput = document.getElementById('password');
        const usernameInput = document.getElementById('username');
        const rememberCheck = document.getElementById('remember');
        const toast = document.getElementById('toast');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');
        const eyeOn = document.getElementById('eyeOn');
        const eyeOff = document.getElementById('eyeOff');
        const forgotLink = document.getElementById('forgotLink');
        const googleBtn = document.getElementById('googleBtn');
        const facebookBtn = document.getElementById('facebookBtn');
        const modeText = document.getElementById('modeText');
        const toggleModeLink = document.getElementById('toggleMode');

        let mode = 'login'; // 'login' | 'register' — chuyển đổi qua link footer

        // ===== Hiện/ẩn mật khẩu =====
        togglePass.addEventListener('click', () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            togglePass.style.color = isPass ? 'var(--blue)' : '';
            togglePass.setAttribute('aria-label', isPass ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
            eyeOn.style.display = isPass ? 'none' : '';
            eyeOff.style.display = isPass ? '' : 'none';
        });

        // ===== Toast =====
        let toastTimer;
        function showToast(msg, type) {
            toast.textContent = msg;
            toast.classList.remove('error', 'success');
            if (type) toast.classList.add(type);
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // ===== Validation inline =====
        function showFieldError(field, msg) {
            const input = field === 'username' ? usernameInput : passInput;
            const errEl = field === 'username' ? usernameError : passwordError;
            input.classList.add('field-error');
            errEl.textContent = msg;
            errEl.classList.add('show');
        }
        function clearErrors() {
            [usernameInput, passInput].forEach(i => i.classList.remove('field-error'));
            [usernameError, passwordError].forEach(e => { e.textContent = ''; e.classList.remove('show'); });
        }
        [usernameInput, passInput].forEach(inp => {
            inp.addEventListener('input', () => {
                inp.classList.remove('field-error');
                const errEl = inp === usernameInput ? usernameError : passwordError;
                errEl.classList.remove('show');
            });
        });

        function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

        // ===== Ghi nhớ email (an toàn, không lưu mật khẩu) =====
        const savedEmail = localStorage.getItem('saved_email');
        if (savedEmail) {
            usernameInput.value = savedEmail;
            rememberCheck.checked = true;
        }

        function setLoading(isLoading) {
            btn.disabled = isLoading;
            btn.classList.toggle('loading', isLoading);
            btnText.textContent = isLoading ? 'Đang xử lý...' : (mode === 'register' ? 'Đăng ký tài khoản' : 'Đăng nhập');
        }

        // ===== Chuyển đổi chế độ Đăng nhập / Đăng ký (dùng lại chính form, không thêm layout) =====
        function switchMode(newMode) {
            mode = newMode;
            if (mode === 'register') {
                modeText.textContent = 'Đã có tài khoản? ';
                toggleModeLink.textContent = 'Đăng nhập ngay';
                btnText.textContent = 'Đăng ký tài khoản';
            } else {
                modeText.textContent = 'Chưa có tài khoản? ';
                toggleModeLink.textContent = 'Đăng ký ngay';
                btnText.textContent = 'Đăng nhập';
            }
            clearErrors();
            passInput.value = '';
        }
        toggleModeLink.addEventListener('click', (e) => {
            e.preventDefault();
            switchMode(mode === 'login' ? 'register' : 'login');
        });

        // ===== Map lỗi Firebase sang tiếng Việt =====
        function mapAuthError(code) {
            switch (code) {
                case 'auth/invalid-email': return 'Email không hợp lệ';
                case 'auth/missing-email': return 'Vui lòng nhập email';
                case 'auth/user-disabled': return 'Tài khoản đã bị khóa';
                case 'auth/user-not-found': return 'Không tìm thấy tài khoản với email này';
                case 'auth/wrong-password': return 'Sai mật khẩu';
                case 'auth/invalid-credential': return 'Sai email hoặc mật khẩu';
                case 'auth/too-many-requests': return 'Quá nhiều lần thử. Vui lòng thử lại sau.';
                case 'auth/network-request-failed': return 'Lỗi mạng. Kiểm tra kết nối.';
                case 'auth/operation-not-allowed': return 'Nhà cung cấp đăng nhập này chưa được bật trong Firebase Console';
                case 'auth/weak-password': return 'Mật khẩu quá yếu (tối thiểu 6 ký tự)';
                case 'auth/email-already-in-use': return 'Email này đã được đăng ký';
                case 'auth/popup-blocked': return 'Trình duyệt chặn popup. Vui lòng cho phép popup.';
                case 'auth/account-exists-with-different-credential': return 'Tài khoản đã tồn tại với phương thức đăng nhập khác';
                default: return 'Đã có lỗi xảy ra. Vui lòng thử lại.';
            }
        }

        // ===== Submit: đăng nhập / đăng ký thật qua Firebase =====
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearErrors();

            const email = usernameInput.value.trim();
            const password = passInput.value;
            let valid = true;

            if (!email) { showFieldError('username', 'Vui lòng nhập email'); valid = false; }
            else if (!isValidEmail(email)) { showFieldError('username', 'Email không hợp lệ (Firebase đăng nhập bằng email)'); valid = false; }
            if (!password) { showFieldError('password', 'Vui lòng nhập mật khẩu'); valid = false; }
            else if (password.length < 6) { showFieldError('password', 'Mật khẩu tối thiểu 6 ký tự'); valid = false; }
            if (!valid) return;

            setLoading(true);
            try {
                // Ghi nhớ đăng nhập THẬT: LOCAL (kéo dài) hoặc SESSION (tắt tab là hết)
                const persistence = rememberCheck.checked ? browserLocalPersistence : browserSessionPersistence;
                await setPersistence(auth, persistence);

                if (mode === 'register') {
                    const userCred = await createUserWithEmailAndPassword(auth, email, password);
                    await sendEmailVerification(userCred.user); // gửi email xác thực
                    if (rememberCheck.checked) localStorage.setItem('saved_email', email);
                    else localStorage.removeItem('saved_email');
                    showToast('Đăng ký thành công! Email xác thực đã được gửi.', 'success');
                    switchMode('login');
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    if (rememberCheck.checked) localStorage.setItem('saved_email', email);
                    else localStorage.removeItem('saved_email');
                    showToast('Đăng nhập thành công', 'success');
                }
                passInput.value = '';
                // TODO: redirect sau khi đăng nhập: window.location.href = '/dashboard';
            } catch (err) {
                const msg = mapAuthError(err.code);
                if (['auth/wrong-password','auth/invalid-credential','auth/user-not-found'].includes(err.code)) {
                    showFieldError('password', msg);
                    passInput.value = '';
                } else if (['auth/invalid-email','auth/missing-email','auth/email-already-in-use'].includes(err.code)) {
                    showFieldError('username', msg);
                } else if (err.code === 'auth/weak-password') {
                    showFieldError('password', msg);
                }
                showToast(msg, 'error');
            } finally {
                setLoading(false);
            }
        });

        // ===== Quên mật khẩu THẬT: Firebase gửi email reset =====
        forgotLink.addEventListener('click', async (e) => {
            e.preventDefault();
            const email = usernameInput.value.trim();
            if (!email || !isValidEmail(email)) {
                showFieldError('username', 'Nhập email vào ô trên để đặt lại mật khẩu');
                usernameInput.focus();
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                showToast('Email đặt lại mật khẩu đã được gửi. Kiểm tra hộp thư của bạn.', 'success');
            } catch (err) {
                showToast(mapAuthError(err.code), 'error');
            }
        });

        // ===== Đăng nhập Google (OAuth thật do Firebase xử lý) =====
        googleBtn.addEventListener('click', async () => {
            try {
                googleBtn.disabled = true; facebookBtn.disabled = true;
                await signInWithPopup(auth, googleProvider);
                showToast('Đăng nhập Google thành công', 'success');
            } catch (err) {
                if (err.code === 'auth/popup-closed-by-user') { /* người dùng tự đóng, không báo lỗi */ }
                else if (err.code === 'auth/operation-not-allowed') {
                    showToast('Chưa bật Google: Firebase Console → Authentication → Sign-in method → Enable Google.', 'error');
                } else if (err.code === 'auth/popup-blocked') {
                    showToast('Trình duyệt chặn popup. Vui lòng cho phép popup.', 'error');
                } else {
                    showToast(mapAuthError(err.code), 'error');
                }
            } finally {
                googleBtn.disabled = false; facebookBtn.disabled = false;
            }
        });

        // ===== Đăng nhập Facebook (cần cấu hình App ID/Secret trong Firebase Console) =====
        facebookBtn.addEventListener('click', async () => {
            try {
                googleBtn.disabled = true; facebookBtn.disabled = true;
                await signInWithPopup(auth, facebookProvider);
                showToast('Đăng nhập Facebook thành công', 'success');
            } catch (err) {
                if (err.code === 'auth/popup-closed-by-user') { /* bỏ qua */ }
                else if (err.code === 'auth/operation-not-allowed') {
                    showToast('Chưa cấu hình Facebook: cần Facebook App ID/Secret → Firebase Console → Authentication → Sign-in method → Facebook.', 'error');
                } else if (err.code === 'auth/popup-blocked') {
                    showToast('Trình duyệt chặn popup. Vui lòng cho phép popup.', 'error');
                } else {
                    showToast(mapAuthError(err.code), 'error');
                }
            } finally {
                googleBtn.disabled = false; facebookBtn.disabled = false;
            }
        });

        // ===== Theo dõi trạng thái đăng nhập (chạy ngầm, không đổi UI) =====
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log('Đã đăng nhập:', user.email, user.uid);
                // Nếu muốn tự động chuyển trang khi đã đăng nhập, bỏ comment dòng dưới:
                // window.location.href = '/dashboard';
            }
        });

        // ===== Enter để submit (giữ nguyên) =====
        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') form.requestSubmit();
            });
        });
    </script>
</body>
</html>
