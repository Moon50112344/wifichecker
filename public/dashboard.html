<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Moon Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #070b14;
            --card: #0d1424;
            --text: #e8ecf5;
            --muted: #6b7794;
            --border: #1e2a44;
            --blue: #2f8bff;
            --blue-hover: #1a7aee;
            --error: #ff6b6b;
            --success: #2ecc71;
        }

        html, body { min-height: 100%; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%; left: 50%;
            transform: translateX(-50%);
            width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(47,139,255,0.10) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(47,139,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(47,139,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none; z-index: 0;
        }

        .dashboard { display: flex; min-height: 100vh; width: 100%; position: relative; z-index: 1; }

        /* ===== Sidebar ===== */
        .sidebar {
            width: 240px; flex-shrink: 0;
            border-right: 1px solid var(--border);
            background: rgba(13,20,36,0.5);
            padding: 24px 16px;
            display: flex; flex-direction: column;
            position: sticky; top: 0; height: 100vh;
        }
        .sidebar-logo {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 20px; font-weight: 700; letter-spacing: -0.5px;
            padding: 0 8px; margin-bottom: 32px;
            text-decoration: none; color: var(--text);
        }
        .sidebar-logo svg { width: 24px; height: 24px; flex-shrink: 0; }
        .sidebar-logo .studio { color: var(--blue); }

        .sidebar-nav { display: flex; flex-direction: column; gap: 4px; }

        .nav-item {
            display: flex; align-items: center;
            padding: 10px 12px; border-radius: 8px;
            color: var(--muted); text-decoration: none;
            font-size: 14px; font-weight: 500;
            cursor: pointer; transition: all 0.15s;
            border: none; background: none;
            font-family: inherit; width: 100%; text-align: left;
        }
        .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
        .nav-item.active { background: rgba(47,139,255,0.10); color: var(--blue); }

        /* ===== Content ===== */
        .content { flex: 1; padding: 32px; max-width: 900px; margin: 0 auto; width: 100%; }

        .view { display: none; }
        .view.active { display: block; }

        .view-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px;
        }
        .view-header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
        .view-header h1 .count {
            font-size: 13px; font-weight: 500; color: var(--muted);
            background: rgba(255,255,255,0.04); border: 1px solid var(--border);
            padding: 2px 10px; border-radius: 20px; margin-left: 8px; vertical-align: middle;
        }

        .btn-primary {
            background: var(--blue); color: #fff; border: none;
            padding: 10px 20px; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: all 0.15s;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--blue-hover); transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(47,139,255,0.25);
        }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

        /* ===== Card Wifi Checker ===== */
        #checkerList { width: 100%; }
        .card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; margin-bottom: 14px;
            transition: all 0.15s;
        }
        .card:hover {
            border-color: #2a3a5c;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .card-head {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 14px;
        }
        .card-title { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
        .card-sub { font-size: 12px; color: var(--muted); }

        .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 12px; font-weight: 500;
            padding: 4px 10px; border-radius: 20px;
            background: rgba(107,119,148,0.1); color: var(--muted);
            border: 1px solid rgba(107,119,148,0.2);
        }
        .status-badge.online {
            background: rgba(46,204,113,0.1); color: var(--success);
            border-color: rgba(46,204,113,0.25);
        }
        .status-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--muted); flex-shrink: 0;
        }
        .status-badge.online .status-dot {
            background: var(--success);
            box-shadow: 0 0 6px rgba(46,204,113,0.6);
        }

        .card-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 13px; padding: 6px 0;
            border-top: 1px solid rgba(30,42,68,0.5);
        }
        .card-row .label { color: var(--muted); }
        .card-row .value { font-weight: 500; }

        .card-foot {
            display: flex; justify-content: flex-end; margin-top: 14px;
        }
        .btn-app {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(47,139,255,0.08);
            border: 1px solid rgba(47,139,255,0.3);
            color: var(--blue); padding: 7px 18px; border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            text-decoration: none; font-family: inherit; transition: all 0.15s;
        }
        .btn-app:hover {
            background: var(--blue); color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(47,139,255,0.3);
        }
        .btn-app svg { width: 14px; height: 14px; }

        /* ===== Empty state — HIỆN NGAY, KHÔNG TRỄ ===== */
        #emptyState {
            display: none;
            text-align: center;
            padding: 8vh 20px;
        }
        #emptyState.show { display: block; }
        #emptyState .empty-icon {
            margin: 0 auto 18px;
            width: 56px; height: 56px; border-radius: 16px;
            background: rgba(47,139,255,0.08);
            border: 1px solid rgba(47,139,255,0.2);
            display: flex; align-items: center; justify-content: center;
            color: var(--blue);
        }
        #emptyState .empty-icon svg { width: 26px; height: 26px; }
        #emptyState h2 { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
        #emptyState p { font-size: 14px; color: var(--muted); margin-bottom: 20px; max-width: 360px; margin-left: auto; margin-right: auto; }

        /* ===== Lỗi tải dữ liệu ===== */
        #loadError {
            display: none;
            background: rgba(255,107,107,0.06);
            border: 1px solid rgba(255,107,107,0.3);
            border-radius: 12px; padding: 18px 20px; margin-bottom: 20px;
            font-size: 13px; color: var(--error); line-height: 1.6;
        }
        #loadError.show { display: block; }
        #loadError code {
            background: rgba(255,255,255,0.06); padding: 2px 6px;
            border-radius: 4px; font-size: 12px;
        }

        /* ===== Form New ===== */
        .form-card { max-width: 400px; margin: 0 auto; } /* FIX giao diện: căn giữa form, không để trống bên phải */
        .form-group { margin-bottom: 14px; position: relative; }
        .form-group label {
            display: block; font-size: 12px; color: var(--muted);
            margin-bottom: 8px; font-weight: 500; letter-spacing: 0.3px;
        }
        .input-box { position: relative; display: flex; align-items: center; }
        .input-box svg {
            position: absolute; left: 14px; width: 18px; height: 18px;
            color: var(--muted); pointer-events: none;
        }
        .input-box input {
            width: 100%; padding: 14px 14px 14px 44px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border); border-radius: 10px;
            color: var(--text); font-size: 15px; font-family: inherit;
            transition: all 0.15s;
        }
        .input-box input:focus {
            outline: none; border-color: var(--blue);
            background: rgba(47,139,255,0.04);
            box-shadow: 0 0 0 3px rgba(47,139,255,0.1);
        }
        .input-box input.field-error { border-color: var(--error); }
        .error-text { display: none; font-size: 12px; color: var(--error); margin-top: 6px; }
        .error-text.show { display: block; }
        .toggle-pass {
            position: absolute; right: 12px; background: none; border: none;
            cursor: pointer; padding: 6px; color: var(--muted);
            display: flex; align-items: center;
        }
        .toggle-pass svg { position: static; width: 18px; height: 18px; }

        /* ===== Profile / Setting ===== */
        .info-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 12px; padding: 8px 20px; margin-bottom: 20px;
        }
        .info-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 0; border-bottom: 1px solid var(--border); font-size: 14px;
        }
        .info-row:last-child { border-bottom: none; }
        .info-row .label { color: var(--muted); }
        .info-row .value { font-weight: 500; word-break: break-all; text-align: right; }

        .setting-section { margin-bottom: 28px; }
        .setting-section h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
        .setting-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 0; border-bottom: 1px solid var(--border); font-size: 14px;
        }
        .setting-row:last-child { border-bottom: none; }
        .setting-row .label { color: var(--muted); }
        .text-muted { color: var(--muted); font-size: 13px; }

        .btn-ghost {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border); color: var(--text);
            padding: 8px 16px; border-radius: 8px;
            font-size: 13px; font-weight: 500; cursor: pointer;
            font-family: inherit; transition: all 0.15s;
        }
        .btn-ghost:hover { border-color: var(--blue); color: var(--blue); }

        .btn-danger {
            background: transparent;
            border: 1px solid rgba(255,107,107,0.4);
            color: var(--error); padding: 10px 20px; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: all 0.15s;
        }
        .btn-danger:hover { background: rgba(255,107,107,0.08); }

        .skeleton-box {
            text-align: center; padding: 60px 20px;
            color: var(--muted);
            border: 1px dashed var(--border); border-radius: 12px;
        }
        .skeleton-box h2 { color: var(--text); font-size: 18px; margin-bottom: 8px; font-weight: 600; }
        .skeleton-box p { font-size: 14px; }

        /* ===== Toast ===== */
        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(100px); /* FIX bug: ẩn mặc định dưới màn hình, tránh viên toast trống hiện mãi */
            background: #16203a; border: 1px solid var(--border);
            color: var(--text); padding: 12px 20px; border-radius: 10px;
            font-size: 14px; z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); max-width: 90vw;
        }
        .toast.show { animation: slideUp 0.2s ease forwards; }
        .toast.hide { animation: slideDown 0.2s ease forwards; }
        @keyframes slideUp { from { transform: translateX(-50%) translateY(100px); } to { transform: translateX(-50%) translateY(0); } }
        @keyframes slideDown { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(100px); } }
        .toast.error { border-color: var(--error); }
        .toast.success { border-color: var(--success); }

        /* ===== Responsive — Đổi breakpoint 1024px → TABLET cũng có thanh ngang trên ===== */
        @media (max-width: 1024px) {
            .dashboard { flex-direction: column; }
            .sidebar {
                width: 100%; height: auto; position: sticky; top: 0;
                flex-direction: row; align-items: center;
                padding: 12px 16px; border-right: none;
                border-bottom: 1px solid var(--border);
                gap: 12px; z-index: 10; overflow-x: auto;
            }
            .sidebar-logo { margin-bottom: 0; flex-shrink: 0; font-size: 17px; }
            .sidebar-nav { flex-direction: row; gap: 4px; flex: 1; overflow-x: auto; }
            .nav-item { width: auto; white-space: nowrap; margin-bottom: 0; }
            .content { padding: 20px 16px; }
            .view-header h1 { font-size: 19px; }
        }

        /* ============================================================
           ===== NÂNG CẤP UI/UX — CHỈ THÊM, KHÔNG SỬA/XÓA CSS CŨ =====
           ===== Không đụng đến JavaScript / logic nào cả            =====
           ============================================================ */
        :root { color-scheme: dark; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            -webkit-tap-highlight-color: transparent;
        }
        ::selection { background: rgba(47,139,255,0.35); color: #fff; }
        input::placeholder { color: var(--muted); opacity: 0.75; }

        /* Viền focus rõ ràng khi điều hướng bằng bàn phím (input đã có focus ring riêng) */
        :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
        input:focus-visible { outline: none; }

        /* Thanh cuộn hợp với theme dark */
        * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
        *::-webkit-scrollbar { width: 8px; height: 8px; }
        *::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        *::-webkit-scrollbar-thumb:hover { background: #2a3a5c; }
        *::-webkit-scrollbar-track { background: transparent; }

        /* Phản hồi nhẹ khi nhấn giữ (active state) */
        .btn-primary:active:not(:disabled),
        .btn-ghost:active,
        .btn-danger:active,
        .nav-item:active { transform: translateY(0) scale(0.98); }

        /* Trạng thái hover không "kẹt" trên thiết bị cảm ứng (touch) */
        @media (hover: none) {
            .card:hover { transform: none; box-shadow: none; border-color: var(--border); }
            .btn-primary:hover:not(:disabled) { transform: none; box-shadow: none; }
            .btn-app:hover { transform: none; box-shadow: none; }
            .btn-ghost:hover { border-color: var(--border); color: var(--text); }
            .btn-danger:hover { background: transparent; }
            .nav-item:hover { background: transparent; color: var(--muted); }
        }

        /* Văn bản dài không tràn khung */
        .card-row .value { word-break: break-word; text-align: right; }
        #loadError code { word-break: break-word; }
        .toast { word-break: break-word; }

        /* Tôn trọng cài đặt giảm chuyển động của người dùng */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* Tablet & mobile: nút bấm đủ kích thước chạm (44px), font input 16px tránh iOS zoom khi focus */
        @media (max-width: 1024px) {
            .nav-item, .btn-primary, .btn-ghost, .btn-danger { min-height: 44px; }
            .input-box input { font-size: 16px; }
            .sidebar-nav { scrollbar-width: none; }
            .sidebar-nav::-webkit-scrollbar { display: none; }
        }

        /* Màn hình rất nhỏ (<480px): bọc header, xếp dọc dòng thông tin cho dễ đọc */
        @media (max-width: 480px) {
            .view-header { flex-wrap: wrap; gap: 12px; }
            .view-header h1 { font-size: 18px; }
            .info-row, .setting-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
                padding: 12px 0;
            }
            .info-row .value, .setting-row .value { text-align: left; }
            .card-head { flex-wrap: wrap; gap: 8px; }
            .toast { bottom: 16px; }
        }

        /* Progressive enhancement: dvh cho trình duyệt mobile (chỉ áp sidebar ở desktop) */
        .dashboard { min-height: 100dvh; }
        @media (min-width: 1025px) {
            .sidebar { height: 100dvh; }
        }

        /* ===== Loading spinner (đã được user phép thêm) — chỉ hiện khi chờ dữ liệu lần đầu ===== */
        #loadingState { display: none; text-align: center; padding: 8vh 20px; color: var(--muted); }
        #loadingState.show { display: block; }
        .spinner {
            width: 36px; height: 36px; margin: 0 auto 14px;
            border: 3px solid rgba(47,139,255,0.15);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loadingState p { font-size: 14px; }

        /* ===== Nút Xóa trên card (SVG) — tính năng mới user yêu cầu ===== */
        .card-foot { justify-content: space-between; align-items: center; gap: 10px; }
        .btn-delete {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255,107,107,0.08);
            border: 1px solid rgba(255,107,107,0.3);
            color: var(--error); padding: 7px 14px; border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: all 0.15s;
        }
        .btn-delete:hover {
            background: var(--error); color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255,107,107,0.3);
        }
        .btn-delete svg { width: 14px; height: 14px; }
        @media (hover: none) {
            .btn-delete:hover { transform: none; box-shadow: none; background: rgba(255,107,107,0.08); color: var(--error); }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <a href="/" class="sidebar-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="#2f8bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                <span>Moon</span><span class="studio">Studio</span>
            </a>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-view="home">Home</button>
                <button class="nav-item" data-view="new">New</button>
                <button class="nav-item" data-view="profile">Profile</button>
                <button class="nav-item" data-view="friend">Friend</button>
                <button class="nav-item" data-view="setting">Setting</button>
            </nav>
        </aside>

        <main class="content">
            <!-- HOME -->
            <section id="view-home" class="view active">
                <div class="view-header">
                    <h1>Home<span class="count" id="appCount">0</span></h1>
                    <button class="btn-primary" data-goto="new">New</button>
                </div>
                <div id="loadError" aria-live="polite"></div>
                <div id="checkerList"></div>
                <div id="loadingState" role="status">
                    <div class="spinner"></div>
                    <p>Đang tải dữ liệu...</p>
                </div>
                <div id="emptyState">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                            <line x1="12" y1="22.08" x2="12" y2="12"/>
                        </svg>
                    </div>
                    <h2>No app yet</h2>
                    <p>Bạn chưa thêm Wifi Checker nào.</p>
                    <button class="btn-primary" data-goto="new">New</button>
                </div>
            </section>

            <!-- NEW -->
            <section id="view-new" class="view">
                <div class="view-header">
                    <h1>Add new Wifi Checker</h1>
                </div>
                <div class="form-card">
                    <form id="addForm" novalidate>
                        <div class="form-group">
                            <label for="checkerUser">Tên đăng nhập</label>
                            <div class="input-box">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                                <input type="text" id="checkerUser" placeholder="Nhập tên đăng nhập" autocomplete="off" spellcheck="false" autocapitalize="none" autocorrect="off" aria-describedby="checkerUserError" required>
                            </div>
                            <span class="error-text" id="checkerUserError"></span>
                        </div>
                        <div class="form-group">
                            <label for="checkerPass">Mật khẩu</label>
                            <div class="input-box">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                                <input type="password" id="checkerPass" placeholder="Nhập mật khẩu" autocomplete="off" spellcheck="false" aria-describedby="checkerPassError" required>
                                <button type="button" class="toggle-pass" id="toggleCheckerPass" aria-label="Hiện mật khẩu">
                                    <svg id="cEyeOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                    <svg id="cEyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                        <line x1="1" y1="1" x2="23" y2="23"/>
                                    </svg>
                                </button>
                            </div>
                            <span class="error-text" id="checkerPassError"></span>
                        </div>
                        <button type="submit" class="btn-primary" id="addBtn">Add</button>
                    </form>
                </div>
            </section>

            <!-- PROFILE -->
            <section id="view-profile" class="view">
                <div class="view-header"><h1>Profile</h1></div>
                <div class="info-card">
                    <div class="info-row"><span class="label">Email</span><span class="value" id="profileEmail">—</span></div>
                    <div class="info-row"><span class="label">Account UID</span><span class="value" id="profileUid">—</span></div>
                    <div class="info-row"><span class="label">Trạng thái email</span><span class="value" id="profileVerified">—</span></div>
                    <div class="info-row"><span class="label">Ngày tạo tài khoản</span><span class="value" id="profileCreated">—</span></div>
                </div>
                <button class="btn-danger" data-signout>Sign out</button>
            </section>

            <!-- FRIEND -->
            <section id="view-friend" class="view">
                <div class="view-header"><h1>Friend</h1></div>
                <div class="skeleton-box">
                    <h2>Friend</h2>
                    <p>Tính năng bạn bè đang được phát triển.</p>
                </div>
            </section>

            <!-- SETTING -->
            <section id="view-setting" class="view">
                <div class="view-header"><h1>Settings</h1></div>
                <div class="setting-section">
                    <h3>Account</h3>
                    <div class="info-card">
                        <div class="info-row"><span class="label">Email</span><span class="value" id="settingEmail">—</span></div>
                        <div class="info-row"><span class="label">UID</span><span class="value" id="settingUid">—</span></div>
                    </div>
                </div>
                <div class="setting-section">
                    <h3>Security</h3>
                    <div class="info-card">
                        <div class="setting-row">
                            <span class="label">Đặt lại mật khẩu</span>
                            <button class="btn-ghost" id="resetPassBtn">Gửi email reset</button>
                        </div>
                    </div>
                    <button class="btn-danger" data-signout>Sign out</button>
                </div>
            </section>
        </main>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, sendPasswordResetEmail,
                 setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        // ===== D1: không còn dùng Firestore =====
        // Dữ liệu lấy qua Worker API /api/* (worker/index.js) — xác thực bằng Firebase ID token.
        // "Realtime" đạt được bằng polling mỗi 4s (D1 không có realtime native).

        const firebaseConfig = {
            apiKey: "AIzaSyDlTcZfcnoftOYIGEXPcmr_3g9pYcms3V8",
            authDomain: "wifichecker-ccf9b.firebaseapp.com",
            projectId: "wifichecker-ccf9b",
            storageBucket: "wifichecker-ccf9b.firebasestorage.app",
            messagingSenderId: "58738730558",
            appId: "1:58738730558:web:b0c0e18daac85aa3d9136f",
            measurementId: "G-5MLQGREBJE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        setPersistence(auth, browserLocalPersistence).catch(() => {});

        const toast = document.getElementById('toast');
        const navItems = document.querySelectorAll('.nav-item');
        const views = document.querySelectorAll('.view');
        const checkerList = document.getElementById('checkerList');
        const emptyState = document.getElementById('emptyState');
        const loadError = document.getElementById('loadError');
        const appCount = document.getElementById('appCount');
        const addForm = document.getElementById('addForm');
        const addBtn = document.getElementById('addBtn');
        const checkerUser = document.getElementById('checkerUser');
        const checkerPass = document.getElementById('checkerPass');
        const loadingState = document.getElementById('loadingState');

        let currentUser = null;
        let pollTimer = null;
        let firstLoad = true; // chỉ hiện loading spinner ở lần tải đầu tiên

        function showToast(msg, type) {
            toast.textContent = msg;
            toast.className = 'toast';
            if (type) toast.classList.add(type);
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.className = 'toast', 200);
            }, 3000);
        }
        let toastTimer;

        function showView(name) {
            views.forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
            navItems.forEach(n => n.classList.toggle('active', n.dataset.view === name));
        }
        navItems.forEach(n => n.addEventListener('click', () => showView(n.dataset.view)));
        document.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => showView(b.dataset.goto)));

        const toggleCP = document.getElementById('toggleCheckerPass');
        const cEyeOn = document.getElementById('cEyeOn');
        const cEyeOff = document.getElementById('cEyeOff');
        toggleCP.addEventListener('click', () => {
            const isPass = checkerPass.type === 'password';
            checkerPass.type = isPass ? 'text' : 'password';
            cEyeOn.style.display = isPass ? 'none' : '';
            cEyeOff.style.display = isPass ? '' : 'none';
        });

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML;
        }

        // ===== Gọi API D1, kèm Firebase ID token =====
        async function api(path, options = {}) {
            const token = await currentUser.getIdToken();
            const res = await fetch('/api' + path, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token,
                    ...(options.headers || {})
                }
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || ('Lỗi ' + res.status));
            return data;
        }

        // ===== Render 1 card (giữ nguyên giao diện cũ) =====
        function renderCard(item) {
            const isOnline = item.status === 'online';
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                        <div class="card-head">
                            <div>
                                <div class="card-title">Wifi Checker</div>
                                <div class="card-sub">Moon Studio</div>
                            </div>
                            <span class="status-badge ${isOnline ? 'online' : ''}">
                                <span class="status-dot"></span>${isOnline ? 'Online' : 'Offline'}
                            </span>
                        </div>
                        <div class="card-row"><span class="label">Username</span><span class="value">${escapeHtml(item.username)}</span></div>
                        <div class="card-foot">
                            <button type="button" class="btn-delete" aria-label="Xóa Wifi Checker này">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                    <line x1="10" y1="11" x2="10" y2="17"/>
                                    <line x1="14" y1="11" x2="14" y2="17"/>
                                </svg>
                                Xóa
                            </button>
                            <a class="btn-app" href="/webremote.html?id=${encodeURIComponent(item.id)}" target="_blank" rel="noopener">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                                    <polyline points="15 3 21 3 21 9"/>
                                    <line x1="10" y1="14" x2="21" y2="3"/>
                                </svg>
                                App
                            </a>
                        </div>`;
            card.querySelector('.btn-delete').addEventListener('click', async () => {
                if (!confirm('Xóa Wifi Checker này? Hành động không thể hoàn tác.')) return;
                try {
                    await api('/checkers/' + encodeURIComponent(item.id), { method: 'DELETE' });
                    showToast('Đã xóa.', 'success');
                    loadCheckers();
                } catch (err) {
                    showToast('Xóa thất bại: ' + err.message, 'error');
                }
            });
            checkerList.appendChild(card);
        }

        // ===== AUTH GUARD — chỉ kiểm tra 1 lần (giữ nguyên logic cũ) =====
        let dashboardChecked = false;
        onAuthStateChanged(auth, (user) => {
            if (dashboardChecked) return;
            dashboardChecked = true;
            if (!user) { window.location.replace('/login'); return; }
            currentUser = user;
            renderProfile(user);
            firstLoad = true;
            loadCheckers();
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(loadCheckers, 4000); // "realtime": polling D1 mỗi 4s
        });

        // ===== Tải danh sách từ D1 =====
        async function loadCheckers() {
            if (firstLoad) {
                loadError.classList.remove('show');
                loadError.innerHTML = '';
                checkerList.innerHTML = '';
                appCount.textContent = '0';
                emptyState.classList.remove('show');
                loadingState.classList.add('show');
            }
            try {
                const data = await api('/checkers');
                const list = data.checkers || [];
                appCount.textContent = list.length;
                checkerList.innerHTML = '';
                emptyState.classList.remove('show');
                loadingState.classList.remove('show');
                firstLoad = false;

                if (list.length === 0) {
                    emptyState.classList.add('show');
                    return;
                }
                list.forEach(renderCard);
            } catch (err) {
                if (firstLoad) {
                    loadingState.classList.remove('show');
                    appCount.textContent = '0';
                    emptyState.classList.remove('show');
                    checkerList.innerHTML = '';
                    loadError.classList.add('show');
                    loadError.textContent = 'Lỗi tải dữ liệu: ' + err.message;
                    showToast('Không tải được dữ liệu', 'error');
                }
                // Nếu là poll lỗi (không phải lần đầu): giữ nguyên dữ liệu cũ, không xóa
            }
        }

        // ===== Thêm mới — POST /api/checkers =====
        addForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = checkerUser.value.trim();
            const password = checkerPass.value;
            let ok = true;
            document.getElementById('checkerUserError').classList.remove('show');
            document.getElementById('checkerPassError').classList.remove('show');
            checkerUser.classList.remove('field-error');
            checkerPass.classList.remove('field-error');
            if (!username) {
                document.getElementById('checkerUserError').textContent = 'Vui lòng nhập tên đăng nhập';
                document.getElementById('checkerUserError').classList.add('show');
                checkerUser.classList.add('field-error');
                ok = false;
            }
            if (!password) {
                document.getElementById('checkerPassError').textContent = 'Vui lòng nhập mật khẩu';
                document.getElementById('checkerPassError').classList.add('show');
                checkerPass.classList.add('field-error');
                ok = false;
            }
            if (!ok || !currentUser) return;

            addBtn.disabled = true;
            addBtn.textContent = 'Đang xử lý...';
            try {
                await api('/checkers', { method: 'POST', body: JSON.stringify({ username, password }) });
                showToast('Thêm thành công!', 'success');
                addForm.reset();
                // Reset ô mật khẩu về dạng ẩn (trước đây nếu đang hiện chữ thì reset vẫn để hiện)
                checkerPass.type = 'password';
                cEyeOn.style.display = '';
                cEyeOff.style.display = 'none';
                showView('home');
                firstLoad = false;
                loadCheckers();
            } catch (err) {
                showToast('Thêm thất bại: ' + err.message, 'error');
            } finally {
                addBtn.disabled = false;
                addBtn.textContent = 'Add';
            }
        });

        function renderProfile(user) {
            const email = user.email || '—';
            document.getElementById('profileEmail').textContent = email;
            document.getElementById('settingEmail').textContent = email;
            document.getElementById('profileUid').textContent = user.uid;
            document.getElementById('settingUid').textContent = user.uid;
            document.getElementById('profileVerified').textContent = user.emailVerified ? 'Đã xác minh' : 'Chưa xác minh';
            document.getElementById('profileCreated').textContent = (user.metadata && user.metadata.creationTime) || '—';
        }

        async function doSignOut() {
            try {
                await signOut(auth);
                window.location.replace('/login');
            } catch (err) {
                showToast('Đăng xuất thất bại', 'error');
            }
        }
        document.querySelectorAll('[data-signout]').forEach(b => b.addEventListener('click', doSignOut));

        document.getElementById('resetPassBtn').addEventListener('click', async () => {
            if (!currentUser || !currentUser.email) return;
            try {
                await sendPasswordResetEmail(auth, currentUser.email);
                showToast('Email đặt lại mật khẩu đã gửi.', 'success');
            } catch (err) {
                showToast('Gửi thất bại.', 'error');
            }
        });
    </script>
</body>
</html>
